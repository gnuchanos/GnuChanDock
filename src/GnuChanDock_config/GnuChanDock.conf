# GnuChanDock settings. Lines use the same Key = value format as system.conf.
Version = "0.1.0"
Background = "#1a0b2e"
BackgroundEdge = "#7b2cbf"
Field = "#241033"
Text = "#e0c3fc"
Accent = "#c77dff"
IconSize = 48
Gap = 30
Padding = 10
Margin = 6
Corner = 16
Magnify = 18
MagnifyReach = 1
Font = "monospace:pixelsize=15"
LabelEnabled = True
SettingsEnabled = True
SettingsIcon = "~/.config/GnuChanDock/settings.png"
SettingsLabel = "settings"
SettingsCommand = "GnuChanSettings"
TerminalEnabled = True
TerminalIcon = "~/.config/GnuChanDock/logo.png"
TerminalLabel = "terminal"
TerminalCommand = "GnuChanTerm"
ShowRunning = True
